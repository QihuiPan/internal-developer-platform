services:
  platform-api:
    build: .
    ports:
      - "${PLATFORM_BIND_ADDRESS:-127.0.0.1}:8080:8080"
    environment:
      PLATFORM_ADDRESS: ":8080"
      PLATFORM_AUTH_MODE: "${PLATFORM_AUTH_MODE:-demo}"
      PLATFORM_AUTH_ROLE: "${PLATFORM_AUTH_ROLE:-platform_admin}"
      PLATFORM_API_TOKEN: "${PLATFORM_API_TOKEN:-}"
    volumes:
      - platform-data:/var/lib/platform
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "/platform-api", "--healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 3
volumes:
  platform-data:
