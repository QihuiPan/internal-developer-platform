services:
  platform-api:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - platform-data:/var/lib/platform
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "/platform-api", "--healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 3
  portal:
    image: nginx:1.29-alpine
    ports:
      - "3000:8080"
    volumes:
      - ./portal:/usr/share/nginx/html:ro
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
    depends_on:
      - platform-api
volumes:
  platform-data:
