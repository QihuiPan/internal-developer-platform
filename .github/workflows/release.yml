name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache: true
      - name: Verify release source
        run: go test ./...
      - name: Build cross-platform archives
        env:
          VERSION: ${{ github.ref_name }}
        run: .github/scripts/package-release.sh
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish multi-architecture container
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
          tags: |
            ghcr.io/qihuipan/internal-developer-platform:${{ github.ref_name }}
            ghcr.io/qihuipan/internal-developer-platform:latest
          labels: |
            org.opencontainers.image.source=https://github.com/QihuiPan/internal-developer-platform
            org.opencontainers.image.version=${{ github.ref_name }}
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --generate-notes --title "${GITHUB_REF_NAME}"
